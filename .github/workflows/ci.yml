name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./... -count=1
      - run: CGO_ENABLED=0 go build ./cmd/crew-assistant
      - name: Verify Windows release target compiles
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o "$RUNNER_TEMP/crew-assistant.exe" ./cmd/crew-assistant
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: internal/dashboard/ui/package-lock.json
      - run: npm ci --prefix internal/dashboard/ui
      - run: npm --prefix internal/dashboard/ui run check
      - run: npm --prefix internal/dashboard/ui test
      - run: npm --prefix internal/dashboard/ui run build
      - run: git diff --exit-code -- internal/dashboard/assets
