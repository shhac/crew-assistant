# The shared family workflow packages binaries, publishes GitHub releases, and
# updates shhac/tap. TAP_DEPLOY_KEY is an environment secret, never a repo secret;
# the homebrew-tap environment accepts v* tag deployments only.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Require a version tag
        env:
          VERSION: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          test "$REF_TYPE" = tag
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]

  verify:
    needs: validate-tag
    uses: ./.github/workflows/ci.yml

  release:
    needs: verify
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    uses: shhac/homebrew-tap/.github/workflows/go-release.yml@main
    permissions:
      contents: write
    secrets: inherit
    with:
      name: crew-assistant
      desc: "Personal AI assistant for coordinating project agents"
      formula_class: CrewAssistant
      help_match: "A personal assistant that coordinates agents"
      # License is detected from LICENSE by the shared workflow.
